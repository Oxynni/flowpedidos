# ═══════════════════════════════════════════════
# FLOWPEDIDOS - nginx.conf (proxy inverso)
# En local: expone la app en http://localhost:80
# Reenvía las peticiones al contenedor "app" en :3000
# (En Render el HTTPS lo gestiona Render automáticamente)
# ═══════════════════════════════════════════════

events {}

http {
  server {
    listen 80;
    server_name localhost;

    location / {
      proxy_pass http://app:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}