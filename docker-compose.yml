services:
  app:
    build: .
    container_name: flowpedidos-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    networks:
      - flowpedidos-net

  nginx:
    image: nginx:alpine
    container_name: flowpedidos-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - flowpedidos-net

networks:
  flowpedidos-net:
    driver: bridge