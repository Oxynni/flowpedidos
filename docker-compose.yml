# ═══════════════════════════════════════════════════════════
# FLOWPEDIDOS - docker-compose.yml
# Orquesta la aplicación + Nginx (proxy inverso)
# Uso: docker compose up --build -d
# ═══════════════════════════════════════════════════════════

services:
  # ─── Aplicación FlowPedidos (Node.js) ───
  app:
    build: .
    container_name: flowpedidos-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    # En redes Docker internas la app queda limitada a nginx
    expose:
      - "3000"
    networks:
      - flowpedidos-net

  # ─── Nginx: proxy inverso (cubre el requisito "Nginx") ───
  nginx:
    image: nginx:alpine
    container_name: flowpedidos-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - flowpedidos-net

networks:
  flowpedidos-net:
    driver: bridge